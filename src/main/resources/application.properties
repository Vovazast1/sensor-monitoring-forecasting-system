spring.application.name=sensors-monitoring-service

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/sensors-monitoring-service
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=true

# Logging
logging.level.com.bachelor.sensorsmonitoringservice=DEBUG
logging.level.org.springframework.web=INFO

# MQTT Configuration
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=sensors-backend
mqtt.username=
mqtt.password=

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=monitoring.mail.service@gmail.com
spring.mail.password=fxsk eitb syge ndll
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false
# Action cooldown
monitoring.action.cooldown-seconds=300

ml.service.url=http://localhost:8000
ml.service.timeout=5000
ml.service.retry.max-attempts=3
ml.service.retry.backoff=1000
